        '503':
          $ref: '#/components/responses/E503'
components:
  securitySchemes:
    wawuId:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: WAWU ID access token (RS256), issuer https://id.wawuafrica.com, verified against https://id.wawuafrica.com/.well-known/jwks.json.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 80
      description: Client-made unique key (a UUID). Same key and same body inside 24 hours (8 days on posting an answer or a reply) returns the
        first result; same key with another body is 409 IDEMPOTENCY_KEY_REUSED. When posting an answer or a reply and the request died after it
        charged, with no post stored, the charge is given back once it is 30 minutes old; sending the same key again then answers 409 CONFLICT
        (start again with a new key) and a new key posts as usual. Sending the key of an answer that was deleted or removed answers 404 (of a
        removed reply, 403 CONTENT_REMOVED); the removed text is never sent again.
    VisitorId:
      name: X-Visitor-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Random id a browser keeps in a first-party cookie. A visitor who is not signed in sends it with listen reports; the server
        stores only a keyed hash of it (never the id, never an IP).
    GuestId:
      name: X-Guest-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Client-made id for a guest, so a guest's likes and ad caps work before sign-in.
  responses:
    E400:
      description: BAD_REQUEST or MIN_TOPICS
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E503:
      description: UNAVAILABLE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E401:
      description: UNAUTHENTICATED or TOKEN_EXPIRED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E402:
      description: INSUFFICIENT_UNITS or FREE_POSTS_EXHAUSTED or EXTRA_VOICE_REQUIRED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E403:
      description: FORBIDDEN, ROLE_REQUIRED or ACCOUNT_SUSPENDED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E404:
      description: NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E409:
      description: CONFLICT or a state error such as ALREADY_VOTED, QUESTION_CLOSED, QUESTION_NOT_OPEN (a write on the question shown as coming
        up), POLL_CLOSED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E413:
      description: PAYLOAD_TOO_LARGE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E415:
      description: UNSUPPORTED_MEDIA_TYPE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E422:
      description: VALIDATION_FAILED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E429:
      description: RATE_LIMITED or DAILY_LIMIT_REACHED (20 messages a day)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E502:
      description: TEXT_FIX_FAILED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Role:
      type: string
      enum:
      - MODERATOR
      - EDITOR
      - AD_MANAGER
      - ADMIN
    NewsTag:
      type: string
      enum:
      - VERIFIED_NEWS
