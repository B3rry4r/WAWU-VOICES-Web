    post:
      operationId: fixText
      tags:
      - text-fix
      summary: Fix the spelling, typos and grammar of my text (5 tokens)
      security:
      - wawuId: []
      description: 'Only spelling, typos and grammar are corrected, never what the text means: the server checks every change and refuses a fix
        that changes more. Costs 5 tokens (config textfix.cost_milli), charged once per Idempotency-Key and only when a fix comes back: an AI
        failure (502 TEXT_FIX_FAILED), a refused fix and a text with nothing to fix cost nothing. The text is sent to the AI provider to be corrected
        and used for nothing else. The person sees the changes and chooses to use the fix or keep their own text. Auth: signed in with a finished
        profile. Rate limit: 10 per 10 minutes per account.'
