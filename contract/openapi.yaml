          minimum: 0
          maximum: 2000000000
          description: Naira in kobo (32-bit integer).
        textPostMilli:
          type: integer
          minimum: -2000000000
          maximum: 2000000000
          description: Tokens as integer milli-tokens, 1 token = 1000 (32-bit). A balance is 0 to 2,000,000,000.
        voicePostMilli:
          type: integer
          minimum: -2000000000
          maximum: 2000000000
          description: Tokens as integer milli-tokens, 1 token = 1000 (32-bit). A balance is 0 to 2,000,000,000.
        reactionAfterFreeMilli:
          type: integer
          minimum: -2000000000
          maximum: 2000000000
          description: Tokens as integer milli-tokens, 1 token = 1000 (32-bit). A balance is 0 to 2,000,000,000.
        voteAfterFreeMilli:
          type: integer
          minimum: -2000000000
          maximum: 2000000000
          description: Tokens as integer milli-tokens, 1 token = 1000 (32-bit). A balance is 0 to 2,000,000,000.
        minPackKobo:
          type: integer
          minimum: 0
          maximum: 2000000000
          description: Naira in kobo (32-bit integer).
        extraVoice30Kobo:
          type: integer
          minimum: 0
          maximum: 2000000000
          description: Naira in kobo (32-bit integer).
        extraVoice60Kobo:
          type: integer
          minimum: 0
          maximum: 2000000000
          description: Naira in kobo (32-bit integer).
        textMaxChars:
          type: integer
        freeVoiceSeconds:
          type: integer
        textPriceChars:
          type: integer
        freePostTextChars:
          type: integer
        messagesPerDay:
          type: integer
        textFixMilli:
          type: integer
          minimum: -2000000000
          maximum: 2000000000
          description: Tokens as integer milli-tokens, 1 token = 1000 (32-bit). A balance is 0 to 2,000,000,000.
        voiceTier1Seconds:
          type: integer
        voiceMaxSeconds:
          type: integer
      additionalProperties: false
      required:
