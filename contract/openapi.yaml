      - PAYLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - UNAVAILABLE
      - INTERNAL
      - subscription_required
      - verification_required
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      additionalProperties: false
      required:
      - error
      description: The one error shape. Every non-2xx response is this.
    ErrorBody:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        requestId:
          type: string
        details: {}
        retryAfterSeconds:
          type: integer
      additionalProperties: false
      required:
      - code
      - message
      - requestId
    AllowanceQuote:
      type: object
      properties:
        action:
          type: string
          enum:
          - POST_TEXT
          - POST_VOICE
          - REACTION
          - VOTE
        costMilli:
          type: integer
          minimum: -2000000000
          maximum: 2000000000
          description: Tokens as integer milli-tokens, 1 token = 1000 (32-bit). A balance is 0 to 2,000,000,000.
        freeLeft:
          type: integer
        balanceMilli:
          type: integer
          minimum: -2000000000
          maximum: 2000000000
          description: Tokens as integer milli-tokens, 1 token = 1000 (32-bit). A balance is 0 to 2,000,000,000.
      additionalProperties: false
      required:
      - action
      - costMilli
      - freeLeft
      - balanceMilli
      description: 'One quote: what this action costs this person now (0 while a free one is left). Returned by GET /me/allowance?action=.'
    Allowances:
      type: object
      properties:
        freePostsRemaining:
          type: integer
        balanceMilli:
          type: integer
          minimum: -2000000000
          maximum: 2000000000
          description: Tokens as integer milli-tokens, 1 token = 1000 (32-bit). A balance is 0 to 2,000,000,000.
        maxVoiceSeconds:
