    post:
      operationId: makeAnswerVideo
      tags:
      - answers
      summary: Make a video of my own voice answer
      security:
      - wawuId: []
      description: 'LCH-07: only when the person asks. Builds an MP4 in the background (9x16 is 1080x1920, 1x1 is 1080x1080, at most 15 seconds:
        discrete bars from the voice''s own levels, the played part highlighted as it plays, a running clock, captions from the stored transcript,
        the question, the mood word on a mood question, the logo; no photos). Answers 202 with the video as QUEUED. Asking again for a shape that
        is queued, being made or ready returns that video. Only the answer''s author can ask (403 for anyone else); a text answer is a 422; a
        removed or deleted answer is a 404. A person may ask for 5 videos a Lagos day, every build counted whatever its outcome, then 429 RATE_LIMITED
        with resetsAt and retryAfterSeconds (Lagos midnight). A failed build can be asked for again (a new build); an answer that was removed
        and restored can too, its old video stays deleted. Until it is READY the share uses the audio link. The person gets an in-app notice (type
        VIDEO_READY) when it is ready or could not be made. Auth: signed in with a finished profile.'
      parameters:
      - name: answerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakeVideoRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceVideo'
        '401':
          $ref: '#/components/responses/E401'
        '403':
