openapi: 3.1.0
info:
  title: VOICES API
  version: 1.0.0
  description: 'The VOICES API (launch scope). Rulings V-1 to V-13 apply. Money in kobo, tokens in milli-tokens (1 token = 1000), times ISO 8601
    UTC, ids UUIDv7, cursor pages, one error shape. See docs/contract/CONVENTIONS.md. After-launch items (V-10) are not here: Messages, AI prompts
    and credits, sponsored surveys, brand pages, push, weekly PDF, ad-free pass.'
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://usevoices.com/api/v1
  description: production
- url: http://localhost:14000/api/v1
  description: local
security:
- wawuId: []
tags:
- name: me-profile
  description: My account, profile, settings, blocks, data export and delete
- name: verification
  description: 'Verification by ID and utility bill (V-46): the person''s side and the admin queue'
- name: topics-calendar
  description: Topic of the week, the calendar, categories
- name: questions-feed
  description: Home, questions, trending and new, answer lists
- name: answers
  description: Text and voice answers, voice upload to Spaces, playback
- name: replies
  description: 'Replies: agree, disagree, my experience'
- name: likes
  description: The free heart
- name: reactions
  description: The 10 reactions, one per person per answer
- name: reports-blocks
  description: Reports and flags
- name: polls-votes
  description: Polls, one vote per account, live results, explain my vote
- name: what-next
  description: What Next? proposals, support and challenge, editorial summary
- name: result-posts
  description: Live results threads and posted numbers (V-7, V-8)
- name: news
  description: The Newsroom and the three news tags
- name: weekly-report
  description: Published weekly reports and the archive
- name: search
  description: Search
- name: notifications
  description: In-app notifications
- name: share
  description: Share links, cards and the public share page
- name: voice-units
  description: Token balance, packs, payments, extra voice tokens, receipts
- name: ads
  description: Labelled advert placements and events
- name: system
  description: Health check, outside /api/v1
- name: analytics
  description: Analytics events
- name: admin
  description: 'The admin console: roles, today, calendar, override, moderation, news review, results queue, weekly approval, adverts, config,
    wallets, audit'
- name: text-fix
  description: The paid AI text fix
paths:
  /me:
    post:
      operationId: createMe
      tags:
      - me-profile
      summary: Create my VOICES profile after WAWU ID sign-in
      security:
      - wawuId: []
      description: 'Idempotent. The bearer token is a WAWU ID RS256 token. Needs 18+ confirmation, terms and rules acceptance, a free handle and
        3 or more categories. Creates the tokens balance, free allowance (5 posts) and settings. Records the referral if a code is sent. Auth:
        WAWU ID token; works before the VOICES profile exists.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/E401'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
    get:
      operationId: getMe
      tags:
      - me-profile
      summary: My account, roles, allowances and unread count
      security:
      - wawuId: []
      description: 'Before profile creation returns profileComplete false with handle null. Auth: WAWU ID token; works before the VOICES profile
        exists.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
    delete:
      operationId: deleteAccount
      tags:
      - me-profile
      summary: Delete my account
      security:
      - wawuId: []
      description: 'Starts a 14 day grace period (cancelled only by the person''s own Undo, POST /me/deletion/cancel; signing in or a refreshed
        token never cancels it), then removes the profile, posts, clips and tokens balance. Unspent tokens are lost (they are never cashed out,
        V-9) and the delete screen says so plainly. Auth: signed in with a finished profile.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/E401'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
  /me/profile:
    patch:
      operationId: updateProfile
      tags:
      - me-profile
      summary: Edit my profile
      security:
      - wawuId: []
      description: 'Auth: signed in with a finished profile.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/E401'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
  /me/handle-check:
    get:
      operationId: checkHandle
      tags:
      - me-profile
      summary: Is a handle free?
      security:
      - wawuId: []
      description: 'Auth: WAWU ID token; works before the VOICES profile exists.'
      parameters:
      - name: handle
        in: query
        required: true
        schema:
          type: string
        description: 3 to 20 of a-z 0-9 . _
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandleCheck'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
  /me/allowance:
    get:
      operationId: getAllowance
      tags:
      - me-profile
      summary: What I can do now and what each action costs
      security:
      - wawuId: []
      description: 'The recorder, composer and vote screens read this before any tap so there are no surprise charges. Auth: signed in with a
        finished profile.'
      parameters:
      - name: action
        in: query
        required: false
        schema:
          type: string
        description: Optional POST_TEXT, POST_VOICE, REACTION or VOTE, to get one quote
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Allowances'
                - $ref: '#/components/schemas/AllowanceQuote'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
  /me/settings:
    get:
      operationId: getSettings
      tags:
      - me-profile
      summary: My settings
      security:
      - wawuId: []
      description: 'Auth: signed in with a finished profile.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
    patch:
      operationId: updateSettings
      tags:
      - me-profile
      summary: Change my settings
      security:
      - wawuId: []
      description: 'Auth: signed in with a finished profile.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/E401'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
  /me/invite:
    get:
      operationId: getMyInvite
      tags:
      - me-profile
      summary: My personal invite link
      security:
      - wawuId: []
      description: 'LCH-06: my one invite code, made the first time it is asked for and never changed, the link built from PUBLIC_WEB_BASE (url
        is PUBLIC_WEB_BASE/go/code), and how many friends have answered through it. Auth: signed in with a finished profile.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyInvite'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '429':
          $ref: '#/components/responses/E429'
  /me/invite/claim:
    post:
      operationId: claimInvite
      tags:
      - me-profile
      summary: Count me as the friend of the person whose link brought me
      security:
      - wawuId: []
      description: 'LCH-06: the web sends the code it kept for the visitor (30 days, first link wins) after the person has posted an answer. Always
        204; it never says whether the code was valid. Ignored when the code is unknown or my own, when I already have an inviter, when my account
        is older than 30 days, when I have no published named (not anonymous) answer, or when either of us blocked the other. Limited to 10 a
        minute per signed-in person (429 with Retry-After), with a high per-address ceiling as an abuse guard. Auth: signed in with a finished
        profile.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimInviteRequest'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
  /me/friends:
    get:
      operationId: listMyFriends
      tags:
      - me-profile
      summary: Friends who answered through my link
      security:
      - wawuId: []
      description: 'LCH-06: the count and a cursor page of the people who came through my link and answered, newest first. A friend''s word is
        returned only to me, only if the friend''s Share my word is on at this moment (else word is null and wordShared is false); the friend
        still counts. A friend counts and shows only through a published, named (not anonymous) answer. Never in a public response. Auth: signed
        in with a finished profile.'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendsPage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '429':
          $ref: '#/components/responses/E429'
  /invites/{code}:
    get:
      operationId: getInviter
      tags:
      - me-profile
      summary: Who sent this invite link (handle only)
      security: []
      description: 'LCH-A2: for the ''asked how you feel'' line on /go. Returns the owner''s handle and nothing else. A code with the wrong shape,
        an unknown code or an owner who is not an active account all answer handle null, so the page shows no line. Never cached. Limited to 60
        a minute per network address (429). Auth: none (public).'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviterHandle'
        '429':
          $ref: '#/components/responses/E429'
  /me/categories:
    put:
      operationId: setCategories
      tags:
      - me-profile
      summary: Set the categories I follow and their alerts
      security:
      - wawuId: []
      description: 'At least 3 categories, else 400 MIN_TOPICS. Auth: signed in with a finished profile.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCategoriesRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetCategoriesRequest'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
    get:
      operationId: getCategories
      tags:
      - me-profile
      summary: The categories I follow and their alert switches
      security:
      - wawuId: []
      description: 'Auth: signed in with a finished profile.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryFollowList'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
  /me/tag-follows:
    put:
      operationId: setTagFollows
      tags:
      - me-profile
      summary: Set the news tags I follow
      security:
      - wawuId: []
      description: 'Verified News is always followed: the server keeps it in the list. Auth: signed in with a finished profile.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTagFollowsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetTagFollowsRequest'
        '401':
          $ref: '#/components/responses/E401'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
  /me/answers:
    get:
      operationId: listMyAnswers
      tags:
      - me-profile
      summary: My voices
      security:
      - wawuId: []
      description: 'Auth: signed in with a finished profile.'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor from nextCursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        description: 1 to 50, default 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerPage'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
  /me/saved:
    get:
      operationId: listSaved
      tags:
      - me-profile
      summary: My saved answers and questions
      security:
      - wawuId: []
      description: 'Both kinds, newest saved first; each item has a kind. savedCount counts both. Auth: signed in with a finished profile.'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor from nextCursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        description: 1 to 50, default 20
      - name: kind
        in: query
        required: false
        schema:
          type: string
        description: ANSWER or QUESTION
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedPage'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
  /me/blocks:
    get:
      operationId: listBlocks
      tags:
      - me-profile
      summary: People I blocked
      security:
      - wawuId: []
      description: 'Auth: signed in with a finished profile.'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor from nextCursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        description: 1 to 50, default 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedUserPage'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
  /me/blocks/{userId}:
    put:
      operationId: blockUser
      tags:
      - me-profile
      summary: Block a person
      security:
      - wawuId: []
      description: 'Auth: signed in with a finished profile.'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
    delete:
      operationId: unblockUser
      tags:
      - me-profile
      summary: Unblock a person
      security:
      - wawuId: []
      description: 'Auth: signed in with a finished profile.'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
  /people/{userId}/replies:
    get:
      operationId: listPersonReplies
      tags:
      - me-profile
      summary: A person's replies
      security:
      - {}
      - wawuId: []
      description: 'Newest first. Replies on removed posts are left out. Auth: guest or signed in.'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor from nextCursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        description: 1 to 50, default 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplyPage'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
  /people/by-handle/{handle}:
    get:
      operationId: getPersonByHandle
      tags:
      - me-profile
      summary: A person's public profile and recent voices, by handle
      security:
      - {}
      - wawuId: []
      description: 'The same answer as GET /people/{userId}: blocks and the public-status rule apply the same way. The handle is matched without
        case. Auth: guest or signed in.'
      parameters:
      - name: handle
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor from nextCursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        description: 1 to 50, default 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
  /people/{userId}:
    get:
      operationId: getPerson
      tags:
      - me-profile
      summary: A person's public profile and recent voices
      security:
      - {}
      - wawuId: []
      description: 'Auth: guest or signed in.'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor from nextCursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        description: 1 to 50, default 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
  /me/export:
    post:
      operationId: requestExport
      tags:
      - me-profile
      summary: Ask for an export of my data
      security:
      - wawuId: []
      description: 'Posts, transcripts and tokens history. Built in the background; poll GET /me/export. Auth: signed in with a finished profile.'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExport'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
    get:
      operationId: getExport
      tags:
      - me-profile
      summary: My latest data export
      security:
      - wawuId: []
      description: 'Auth: signed in with a finished profile.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExport'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
  /me/deletion/cancel:
    post:
      operationId: cancelDeletion
      tags:
      - me-profile
      summary: Undo my pending account deletion
      security:
      - wawuId: []
      description: 'The only way a pending deletion is cancelled (lead ruling WF, fix round 1, RW9). Idempotent: with nothing pending it answers
        the same Me. 409 once the purge has run. Writes an audit line. Auth: WAWU ID token; works before the VOICES profile exists.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/E401'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
  /me/verification:
    get:
      operationId: getMyVerification
      tags:
      - verification
      summary: Where my verification stands
      security:
      - wawuId: []
      description: 'V-46: state is NOT_SUBSCRIBED, READY, UNDER_REVIEW, VERIFIED, REJECTED (reason in request.reason, in plain words), EXPIRED
        (sent and never decided for 90 days: send again) or LAPSED. Verified means an admin approved the ID and utility bill and the subscription
        is running; verifiedUntil is the end of the plan (a renewal extends it). Auth: signed in with a finished profile.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationState'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
  /me/verification/documents/{kind}:
    put:
      operationId: putVerificationDocument
      tags:
      - verification
      summary: Upload my ID (kind id) or my utility bill (kind bill)
      security:
      - wawuId: []
      description: 'V-46: the body is the file itself (not JSON, not a form): jpeg, png, webp, heic or pdf, at most 10 MB. The type is read from
        the bytes, never from the name. Stored privately; no link to it is ever given to the person or the public. Sending again replaces that
        document. 403 subscription_required (message: Subscribe to get verified.) without a running subscription; 409 while the request is with
        the team or the person is already verified. Auth: signed in with a finished profile. Rate limit: 30 per 10 minutes per account.'
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
