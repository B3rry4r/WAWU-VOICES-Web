      - ACCOUNT_SUSPENDED
      - NOT_FOUND
      - CONFLICT
      - IDEMPOTENCY_KEY_REQUIRED
      - IDEMPOTENCY_KEY_REUSED
      - REQUEST_IN_PROGRESS
      - INSUFFICIENT_UNITS
      - FREE_POSTS_EXHAUSTED
      - VOICE_TOO_LONG
      - EXTRA_VOICE_REQUIRED
      - DAILY_LIMIT_REACHED
