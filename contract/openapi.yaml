      - voteAfterFreeMilli
      - minPackKobo
      - extraVoice30Kobo
      - extraVoice60Kobo
      - textMaxChars
      - freeVoiceSeconds
      description: 'Prices in tokens (V-36). textPostMilli is the price of textPriceChars characters, charged in proportion (5 tokens per 150
        characters, rounded to the hundredth). The voice prices are extraVoice30Kobo (up to voiceTier1Seconds) and extraVoice60Kobo (up to voiceMaxSeconds),
        in kobo: 1 token is 100 kobo. A free post covers a voice of freeVoiceSeconds or a text of freePostTextChars; longer pays in full.'
