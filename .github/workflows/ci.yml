name: CI

# Tests run on a pull request that is ready for review, and nowhere else. Running them on every push to
# every branch used up the account's Actions allowance on 14 Nov 2026, and GitHub then refused the deploys.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, tests, build)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
