<p style="margin: 0; font: 400 17px/25px var(--font-body); color: var(--ink-2);">Pick at least 3. We use them to fill your Home. Today's question shows for everyone.</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px;">
<x-import component-from-global-scope="Voices.TopicChip" label="Money" selected="{{yes}}"></x-import>
<x-import component-from-global-scope="Voices.TopicChip" label="Work" selected="{{yes}}"></x-import>
<x-import component-from-global-scope="Voices.TopicChip" label="Power" selected="{{yes}}"></x-import>
<x-import component-from-global-scope="Voices.TopicChip" label="Family" selected="{{yes}}"></x-import>
<x-import component-from-global-scope="Voices.TopicChip" label="Love"></x-import>
<x-import component-from-global-scope="Voices.TopicChip" label="Faith"></x-import>
<x-import component-from-global-scope="Voices.TopicChip" label="Food prices"></x-import>
<x-import component-from-global-scope="Voices.TopicChip" label="Roads"></x-import>

<x-import component-from-global-scope="Voices.TopicChip" label="Sport"></x-import>
</div>
</div>

<p style="margin: 0; font: 400 16px/24px var(--font-body); color: var(--ink-2);">Get told when a new question lands in a topic you picked.</p>
<div class="vx-notes" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));">
<label style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; cursor: pointer;"><x-import component-from-global-scope="Voices.Icon" name="coins" size="{{s20}}"></x-import><span style="flex: 1; font: 600 16px/22px var(--font-body);">Money</span><input type="checkbox" role="switch" checked class="vx-sr"><span aria-hidden="true" style="flex: none; position: relative; width: 52px; height: 32px; border-radius: 999px; background: var(--green);"><span style="position: absolute; top: 4px; left: 24px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-1);"></span></span></label>

<label style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; cursor: pointer; box-shadow: 0 -1px 0 var(--line), -1px 0 0 var(--line);"><x-import component-from-global-scope="Voices.Icon" name="heart" size="{{s20}}"></x-import><span style="flex: 1; font: 600 16px/22px var(--font-body);">Family</span><input type="checkbox" role="switch" class="vx-sr"><span aria-hidden="true" style="flex: none; position: relative; width: 52px; height: 32px; border-radius: 999px; background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line-strong);"><span style="position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--line-strong);"></span></span></label>

</div>
